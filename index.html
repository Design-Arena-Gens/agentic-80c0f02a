<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Durak Card Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #2d5a27;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .game-info {
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
            background-color: rgba(0,0,0,0.3);
            border-radius: 5px;
        }
        
        .deck-info {
            text-align: center;
            margin-bottom: 15px;
        }
        
        .trump-card {
            display: inline-block;
            padding: 5px 10px;
            background-color: rgba(255,255,255,0.2);
            border-radius: 3px;
            margin-left: 10px;
        }
        
        .player-area {
            margin-bottom: 20px;
            padding: 15px;
            background-color: rgba(0,0,0,0.2);
            border-radius: 8px;
        }
        
        .player-label {
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .hand {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            min-height: 80px;
        }
        
        .card {
            width: 50px;
            height: 70px;
            background-color: white;
            color: black;
            border: 2px solid #333;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        
        .card:hover {
            border-color: #ffd700;
        }
        
        .card.selected {
            border-color: #00ff00;
            transform: translateY(-5px);
        }
        
        .card.red {
            color: red;
        }
        
        .card.hidden {
            background-color: #4169e1;
            color: white;
        }
        
        .card.hidden span {
            display: none;
        }
        
        .card.hidden::after {
            content: "?";
            font-size: 24px;
        }
        
        .battle-area {
            margin: 20px 0;
            padding: 20px;
            background-color: rgba(0,0,0,0.3);
            border-radius: 8px;
            min-height: 120px;
        }
        
        .battle-label {
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .battle-pairs {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        
        .battle-pair {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        button:disabled {
            background-color: #666;
            cursor: not-allowed;
        }
        
        .status {
            text-align: center;
            padding: 15px;
            background-color: rgba(0,0,0,0.4);
            border-radius: 5px;
            margin-top: 20px;
            font-size: 18px;
        }
        
        .winner {
            color: #ffd700;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Durak Card Game</h1>
    
    <div class="game-info">
        <div class="deck-info">
            Deck: <span id="deckCount">36</span> cards
            <span class="trump-card">Trump: <span id="trumpSuit">♠</span></span>
        </div>
    </div>
    
    <div class="player-area">
        <div class="player-label">Opponent (<span id="opponentCount">0</span> cards)</div>
        <div class="hand" id="opponentHand"></div>
    </div>
    
    <div class="battle-area">
        <div class="battle-label">Battle Area</div>
        <div class="battle-pairs" id="battleArea"></div>
    </div>
    
    <div class="player-area">
        <div class="player-label">Your Hand (<span id="playerCount">0</span> cards)</div>
        <div class="hand" id="playerHand"></div>
    </div>
    
    <div class="controls">
        <button id="attackBtn" onclick="attack()">Attack</button>
        <button id="defendBtn" onclick="defend()">Defend</button>
        <button id="takeBtn" onclick="takeCards()">Take Cards</button>
        <button id="passBtn" onclick="passTurn()">Pass / End Attack</button>
        <button onclick="newGame()">New Game</button>
    </div>
    
    <div class="status" id="status">Click "New Game" to start!</div>

    <script>
        // Card suits and values
        const suits = ['♠', '♣', '♥', '♦'];
        const values = ['6', '7', '8', '9', '10', 'J', 'Q', 'K', 'A'];
        const valueOrder = {'6': 0, '7': 1, '8': 2, '9': 3, '10': 4, 'J': 5, 'Q': 6, 'K': 7, 'A': 8};
        
        // Game state
        let deck = [];
        let playerHand = [];
        let opponentHand = [];
        let battlePairs = []; // [{attack: card, defense: card or null}]
        let trumpSuit = '';
        let isPlayerAttacking = true;
        let selectedCard = null;
        let gameOver = false;
        
        // Create a card object
        function createCard(suit, value) {
            return { suit, value, id: `${value}${suit}` };
        }
        
        // Create and shuffle deck
        function createDeck() {
            deck = [];
            for (let suit of suits) {
                for (let value of values) {
                    deck.push(createCard(suit, value));
                }
            }
            // Shuffle
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
        }
        
        // Draw cards from deck
        function drawCards(hand, count) {
            while (hand.length < count && deck.length > 0) {
                hand.push(deck.pop());
            }
        }
        
        // Check if card can beat another card
        function canBeat(attackCard, defenseCard) {
            if (defenseCard.suit === attackCard.suit) {
                return valueOrder[defenseCard.value] > valueOrder[attackCard.value];
            }
            if (defenseCard.suit === trumpSuit && attackCard.suit !== trumpSuit) {
                return true;
            }
            return false;
        }
        
        // Get values currently in battle
        function getBattleValues() {
            const values = new Set();
            for (let pair of battlePairs) {
                values.add(pair.attack.value);
                if (pair.defense) {
                    values.add(pair.defense.value);
                }
            }
            return values;
        }
        
        // Check if attack card is valid
        function canAttackWith(card) {
            if (battlePairs.length === 0) return true;
            const battleValues = getBattleValues();
            return battleValues.has(card.value);
        }
        
        // Render a card element
        function renderCard(card, hidden = false, clickable = false, index = -1) {
            const isRed = card.suit === '♥' || card.suit === '♦';
            const isTrump = card.suit === trumpSuit;
            let classes = 'card';
            if (hidden) classes += ' hidden';
            if (isRed && !hidden) classes += ' red';
            if (selectedCard === index) classes += ' selected';
            
            const onclick = clickable ? `onclick="selectCard(${index})"` : '';
            const trumpMark = isTrump && !hidden ? '*' : '';
            
            return `<div class="${classes}" ${onclick}>
                <span>${hidden ? '' : card.value}</span>
                <span>${hidden ? '' : card.suit}${trumpMark}</span>
            </div>`;
        }
        
        // Render the game
        function render() {
            // Opponent hand (hidden)
            document.getElementById('opponentHand').innerHTML = 
                opponentHand.map(card => renderCard(card, true)).join('');
            document.getElementById('opponentCount').textContent = opponentHand.length;
            
            // Player hand
            document.getElementById('playerHand').innerHTML = 
                playerHand.map((card, i) => renderCard(card, false, true, i)).join('');
            document.getElementById('playerCount').textContent = playerHand.length;
            
            // Battle area
            let battleHTML = '';
            for (let pair of battlePairs) {
                battleHTML += `<div class="battle-pair">
                    ${pair.defense ? renderCard(pair.defense) : '<div class="card" style="opacity:0.3">?</div>'}
                    ${renderCard(pair.attack)}
                </div>`;
            }
            document.getElementById('battleArea').innerHTML = battleHTML;
            
            // Deck info
            document.getElementById('deckCount').textContent = deck.length;
            document.getElementById('trumpSuit').textContent = trumpSuit;
            
            // Update buttons
            document.getElementById('attackBtn').disabled = !isPlayerAttacking || gameOver;
            document.getElementById('defendBtn').disabled = isPlayerAttacking || gameOver;
            document.getElementById('takeBtn').disabled = isPlayerAttacking || gameOver;
            document.getElementById('passBtn').disabled = gameOver;
        }
        
        // Select a card
        function selectCard(index) {
            if (gameOver) return;
            selectedCard = selectedCard === index ? null : index;
            render();
        }
        
        // Attack action
        function attack() {
            if (!isPlayerAttacking || selectedCard === null || gameOver) return;
            
            const card = playerHand[selectedCard];
            
            // Check if we can attack with this card
            if (!canAttackWith(card)) {
                setStatus("Can't attack with this card! Must match a value in battle.");
                return;
            }
            
            // Check if opponent has cards to defend
            if (battlePairs.filter(p => !p.defense).length > 0) {
                setStatus("Wait for opponent to defend first!");
                return;
            }
            
            // Check max attacks
            if (battlePairs.length >= 6 || battlePairs.length >= opponentHand.length) {
                setStatus("Can't add more attack cards!");
                return;
            }
            
            // Make the attack
            playerHand.splice(selectedCard, 1);
            battlePairs.push({ attack: card, defense: null });
            selectedCard = null;
            
            setStatus("You attacked! Opponent is defending...");
            render();
            
            // Opponent defends after short delay
            setTimeout(opponentDefend, 500);
        }
        
        // Defend action
        function defend() {
            if (isPlayerAttacking || selectedCard === null || gameOver) return;
            
            const card = playerHand[selectedCard];
            
            // Find undefended attack
            const undefended = battlePairs.find(p => !p.defense);
            if (!undefended) {
                setStatus("Nothing to defend against!");
                return;
            }
            
            // Check if card can beat the attack
            if (!canBeat(undefended.attack, card)) {
                setStatus("This card can't beat the attack!");
                return;
            }
            
            // Make the defense
            playerHand.splice(selectedCard, 1);
            undefended.defense = card;
            selectedCard = null;
            
            // Check if all attacks defended
            if (battlePairs.every(p => p.defense)) {
                setStatus("All attacks defended! Opponent may continue or pass.");
                render();
                setTimeout(opponentAttack, 500);
            } else {
                setStatus("Defended! More attacks to defend...");
                render();
            }
        }
        
        // Take cards (give up defending)
        function takeCards() {
            if (isPlayerAttacking || gameOver) return;
            
            // Player takes all cards from battle
            for (let pair of battlePairs) {
                playerHand.push(pair.attack);
                if (pair.defense) playerHand.push(pair.defense);
            }
            battlePairs = [];
            
            // Draw cards (attacker first)
            drawCards(opponentHand, 6);
            drawCards(playerHand, 6);
            
            // Opponent attacks again
            isPlayerAttacking = false;
            selectedCard = null;
            
            setStatus("You took the cards. Opponent attacks again!");
            render();
            
            checkGameOver();
            if (!gameOver) setTimeout(opponentAttack, 500);
        }
        
        // Pass turn (end attack or confirm defense)
        function passTurn() {
            if (gameOver) return;
            
            if (isPlayerAttacking) {
                // Player passes attack - opponent defends successfully
                if (battlePairs.length === 0) {
                    setStatus("You must attack first!");
                    return;
                }
                
                if (!battlePairs.every(p => p.defense)) {
                    setStatus("Opponent hasn't defended all attacks yet!");
                    return;
                }
                
                // Battle ends, cards discarded
                battlePairs = [];
                
                // Draw cards
                drawCards(playerHand, 6);
                drawCards(opponentHand, 6);
                
                // Switch roles
                isPlayerAttacking = false;
                selectedCard = null;
                
                setStatus("Attack ended. Now opponent attacks!");
                render();
                
                checkGameOver();
                if (!gameOver) setTimeout(opponentAttack, 500);
            } else {
                setStatus("You can only pass when attacking!");
            }
        }
        
        // Opponent attack AI
        function opponentAttack() {
            if (gameOver) return;
            
            // Find valid attack card
            let attackCard = null;
            let attackIndex = -1;
            
            if (battlePairs.length === 0) {
                // First attack - use lowest non-trump card
                let lowestValue = 99;
                for (let i = 0; i < opponentHand.length; i++) {
                    const card = opponentHand[i];
                    const val = valueOrder[card.value] + (card.suit === trumpSuit ? 100 : 0);
                    if (val < lowestValue) {
                        lowestValue = val;
                        attackCard = card;
                        attackIndex = i;
                    }
                }
            } else {
                // Additional attack - must match value
                const battleValues = getBattleValues();
                for (let i = 0; i < opponentHand.length; i++) {
                    const card = opponentHand[i];
                    if (battleValues.has(card.value)) {
                        attackCard = card;
                        attackIndex = i;
                        break;
                    }
                }
            }
            
            // Check limits
            if (battlePairs.length >= 6 || battlePairs.length >= playerHand.length) {
                attackCard = null;
            }
            
            if (attackCard && attackIndex >= 0) {
                opponentHand.splice(attackIndex, 1);
                battlePairs.push({ attack: attackCard, defense: null });
                setStatus("Opponent attacks! Select a card and click Defend.");
                render();
            } else {
                // Opponent can't/won't attack more - end battle
                if (battlePairs.length > 0 && battlePairs.every(p => p.defense)) {
                    // Successful defense
                    battlePairs = [];
                    drawCards(opponentHand, 6);
                    drawCards(playerHand, 6);
                    isPlayerAttacking = true;
                    setStatus("You defended successfully! Your turn to attack.");
                    render();
                    checkGameOver();
                } else if (battlePairs.length === 0) {
                    // Opponent has no cards to attack with initially
                    isPlayerAttacking = true;
                    setStatus("Opponent can't attack. Your turn!");
                    render();
                    checkGameOver();
                }
            }
        }
        
        // Opponent defend AI
        function opponentDefend() {
            if (gameOver) return;
            
            const undefended = battlePairs.find(p => !p.defense);
            if (!undefended) return;
            
            // Find lowest card that can beat the attack
            let defenseCard = null;
            let defenseIndex = -1;
            let lowestPower = 999;
            
            for (let i = 0; i < opponentHand.length; i++) {
                const card = opponentHand[i];
                if (canBeat(undefended.attack, card)) {
                    const power = valueOrder[card.value] + (card.suit === trumpSuit ? 100 : 0);
                    if (power < lowestPower) {
                        lowestPower = power;
                        defenseCard = card;
                        defenseIndex = i;
                    }
                }
            }
            
            if (defenseCard && defenseIndex >= 0) {
                opponentHand.splice(defenseIndex, 1);
                undefended.defense = defenseCard;
                
                // Check if more undefended attacks
                if (battlePairs.some(p => !p.defense)) {
                    setStatus("Opponent defended. More attacks remain!");
                } else {
                    setStatus("Opponent defended all. Attack more or Pass.");
                }
                render();
            } else {
                // Opponent takes cards
                for (let pair of battlePairs) {
                    opponentHand.push(pair.attack);
                    if (pair.defense) opponentHand.push(pair.defense);
                }
                battlePairs = [];
                
                // Draw cards
                drawCards(playerHand, 6);
                drawCards(opponentHand, 6);
                
                // Player attacks again
                isPlayerAttacking = true;
                selectedCard = null;
                
                setStatus("Opponent took the cards! Attack again!");
                render();
                checkGameOver();
            }
        }
        
        // Check for game over
        function checkGameOver() {
            if (deck.length > 0) return;
            
            if (playerHand.length === 0 && opponentHand.length === 0) {
                setStatus('<span class="winner">Draw! Both players finished!</span>');
                gameOver = true;
            } else if (playerHand.length === 0) {
                setStatus('<span class="winner">You Win! Opponent is the Durak!</span>');
                gameOver = true;
            } else if (opponentHand.length === 0) {
                setStatus('<span class="winner">You Lose! You are the Durak!</span>');
                gameOver = true;
            }
            
            if (gameOver) render();
        }
        
        // Set status message
        function setStatus(msg) {
            document.getElementById('status').innerHTML = msg;
        }
        
        // Start new game
        function newGame() {
            createDeck();
            playerHand = [];
            opponentHand = [];
            battlePairs = [];
            selectedCard = null;
            gameOver = false;
            
            // Set trump suit (last card in deck)
            trumpSuit = deck[0].suit;
            
            // Deal cards
            drawCards(playerHand, 6);
            drawCards(opponentHand, 6);
            
            // Determine who attacks first (lowest trump)
            let playerLowestTrump = 99;
            let opponentLowestTrump = 99;
            
            for (let card of playerHand) {
                if (card.suit === trumpSuit) {
                    playerLowestTrump = Math.min(playerLowestTrump, valueOrder[card.value]);
                }
            }
            for (let card of opponentHand) {
                if (card.suit === trumpSuit) {
                    opponentLowestTrump = Math.min(opponentLowestTrump, valueOrder[card.value]);
                }
            }
            
            isPlayerAttacking = playerLowestTrump <= opponentLowestTrump;
            
            if (isPlayerAttacking) {
                setStatus("Game started! You attack first. Select a card and click Attack.");
            } else {
                setStatus("Game started! Opponent attacks first.");
                setTimeout(opponentAttack, 500);
            }
            
            render();
        }
        
        // Initialize
        render();
    </script>
</body>
</html>
